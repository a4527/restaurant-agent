name: API - Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - '05-sam/**'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  SAM_STACK_NAME: dining-sam-api

jobs:
  deploy:
    name: SAM Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Read parameters from SSM
        id: ssm
        run: |
          RUNTIME_ARN=$(aws ssm get-parameter \
            --name "/dining/RUNTIME_ARN" \
            --query "Parameter.Value" --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")

          if [ -z "$RUNTIME_ARN" ]; then
            RUNTIME_ARN=$(aws bedrock-agentcore-control list-agent-runtimes \
              --region ${{ env.AWS_REGION }} \
              --query "agentRuntimes[?status=='READY'].agentRuntimeArn | [0]" \
              --output text 2>/dev/null || echo "")
          fi

          MEMORY_ID=$(aws ssm get-parameter \
            --name "/dining/MEMORY_ID" \
            --query "Parameter.Value" --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")

          if [ -z "$MEMORY_ID" ]; then
            MEMORY_ID=$(aws bedrock-agentcore-control list-memories \
              --region ${{ env.AWS_REGION }} \
              --query "memories[?contains(name,'dining') && status=='ACTIVE'].id | [0]" \
              --output text 2>/dev/null || echo "")
          fi

          echo "runtime_arn=$RUNTIME_ARN" >> $GITHUB_OUTPUT
          echo "memory_id=$MEMORY_ID" >> $GITHUB_OUTPUT
          echo "RUNTIME_ARN=$RUNTIME_ARN"
          echo "MEMORY_ID=$MEMORY_ID"

      - name: SAM Build
        working-directory: 05-sam
        run: sam build

      - name: SAM Deploy
        working-directory: 05-sam
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides \
              RuntimeArn="${{ steps.ssm.outputs.runtime_arn }}" \
              MemoryId="${{ steps.ssm.outputs.memory_id }}"

      - name: Save API URL to SSM
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ChatApiUrl'].OutputValue" \
            --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          if [ -n "$API_URL" ]; then
            aws ssm put-parameter \
              --name "/dining/API_URL" \
              --value "$API_URL" \
              --type String \
              --overwrite \
              --region ${{ env.AWS_REGION }}
            echo "✅ SSM /dining/API_URL 저장: $API_URL"
          fi
