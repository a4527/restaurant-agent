name: Agent - Evaluate & Deploy

on:
  push:
    branches: [main]
    paths:
      - '02-agent/**'
      - '04-pipeline/**'
      - '.github/workflows/agent.yml'
      - '.github/scripts/**'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

jobs:
  evaluate:
    name: Strands Evals Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install strands-agents strands-agents-evals boto3 mcp

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run evaluation
        working-directory: 04-pipeline
        run: python eval_gate.py

  deploy:
    name: AgentCore Deploy
    needs: evaluate
    runs-on: ubuntu-latest
    outputs:
      runtime_arn: ${{ steps.extract.outputs.runtime_arn }}
      memory_id: ${{ steps.extract.outputs.memory_id }}
      gateway_url: ${{ steps.extract.outputs.gateway_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AgentCore CLI
        run: npm install -g @aws/agentcore

      - name: Install uv (Python package manager)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create Memory (if not exists)
        env:
          REGION: ${{ env.AWS_REGION }}
        run: |
          # SSM에 저장된 MEMORY_ID 확인
          MEMORY_ID=$(aws ssm get-parameter \
            --name "/dining/MEMORY_ID" \
            --query "Parameter.Value" --output text \
            --region "$REGION" 2>/dev/null || echo "")

          if [ -z "$MEMORY_ID" ] || [ "$MEMORY_ID" = "None" ]; then
            echo "Memory 없음 → 새로 생성"
            RESULT=$(aws bedrock-agentcore-control create-memory \
              --name "DiningConcierge_dining_memory" \
              --event-expiry-duration 30 \
              --memory-strategies '[{"userPreferenceMemoryStrategy":{"name":"preferences","namespaceTemplates":["/users/{actorId}/preferences"]}},{"semanticMemoryStrategy":{"name":"facts","namespaceTemplates":["/users/{actorId}/facts"]}}]' \
              --region "$REGION" 2>&1)
            echo "$RESULT"
            MEMORY_ID=$(echo "$RESULT" | python3 .github/scripts/parse_memory_id.py)
            echo "생성된 Memory ID: $MEMORY_ID"

            echo "ACTIVE 대기 중..."
            for i in $(seq 1 20); do
              STATUS=$(aws bedrock-agentcore-control get-memory \
                --memory-id "$MEMORY_ID" --region "$REGION" \
                --query "memory.status" --output text 2>/dev/null || echo "")
              echo "  상태: $STATUS ($i/20)"
              [ "$STATUS" = "ACTIVE" ] && echo "✅ Memory ACTIVE" && break
              sleep 15
            done

            # SSM에 저장
            aws ssm put-parameter --name "/dining/MEMORY_ID" \
              --value "$MEMORY_ID" --type String --overwrite \
              --region "$REGION" && echo "✅ SSM /dining/MEMORY_ID 저장"
          else
            echo "✅ 기존 Memory 재사용: $MEMORY_ID"
          fi

      - name: Create Web Search Gateway (if not exists)
        run: |
          GATEWAYS=$(aws bedrock-agentcore-control list-gateways --region us-east-1 --output json 2>/dev/null || echo '{"items":[]}')
          GATEWAY_ID=$(echo "$GATEWAYS" | python3 .github/scripts/find_gateway.py)

          if [ -z "$GATEWAY_ID" ]; then
            echo "Gateway 없음 → AWS CLI로 생성"
            ROLE_ARN=$(aws iam get-role --role-name dining-gateway-role \
              --query "Role.Arn" --output text 2>/dev/null || echo "")
            if [ -z "$ROLE_ARN" ]; then
              echo "⚠️  dining-gateway-role 없음 — Gateway 건너뜀"
            else
              RESULT=$(aws bedrock-agentcore-control create-gateway \
                --name "dining-web-search" --protocol-type MCP \
                --authorizer-type NONE --role-arn "$ROLE_ARN" \
                --region us-east-1 2>&1)
              echo "$RESULT"
              GATEWAY_ID=$(echo "$RESULT" | python3 .github/scripts/parse_gateway_id.py)
              echo "Gateway READY 대기 중..."
              for i in $(seq 1 12); do
                STATUS=$(aws bedrock-agentcore-control get-gateway \
                  --gateway-identifier "$GATEWAY_ID" --region us-east-1 \
                  --query "status" --output text 2>/dev/null || echo "")
                echo "  상태: $STATUS ($i/12)"
                [ "$STATUS" = "READY" ] && echo "✅ Gateway READY" && break
                sleep 10
              done
            fi
          else
            echo "✅ 기존 Gateway 재사용: $GATEWAY_ID"
          fi

          if [ -n "$GATEWAY_ID" ]; then
            TARGETS=$(aws bedrock-agentcore-control list-gateway-targets \
              --gateway-identifier "$GATEWAY_ID" --region us-east-1 \
              --output json 2>/dev/null || echo '{"items":[]}')
            TARGET_COUNT=$(echo "$TARGETS" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('items',[])))")

            if [ "$TARGET_COUNT" = "0" ]; then
              echo "Gateway target 없음 → CloudFormation으로 생성"
              python3 .github/scripts/write_gateway_template.py "$GATEWAY_ID"
              aws cloudformation deploy \
                --template-file /tmp/gateway-target.json \
                --stack-name dining-gateway-target \
                --region us-east-1 && echo "✅ Gateway target 생성 완료" || \
              echo "⚠️  Gateway target 생성 실패 (계속 진행)"
            else
              echo "✅ 기존 Gateway target 재사용 ($TARGET_COUNT개)"
            fi
          fi

      - name: Install CDK dependencies
        working-directory: 02-agent/agentcore/cdk
        run: |
          npm ci
          npm run build

      - name: CDK Bootstrap
        working-directory: 02-agent/agentcore/cdk
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap aws://${ACCOUNT_ID}/${{ env.AWS_REGION }}

      - name: Deploy to AgentCore Runtime
        working-directory: 02-agent
        run: npx @aws/agentcore deploy --yes --verbose

      - name: Extract ARN/ID/URL and save to SSM
        id: extract
        env:
          REGION: ${{ env.AWS_REGION }}
        run: |
          RUNTIME_ARN=$(aws bedrock-agentcore-control list-agent-runtimes \
            --region "$REGION" --output json 2>/dev/null | \
            python3 .github/scripts/find_runtime_arn.py || echo "")

          MEMORY_ID=$(aws bedrock-agentcore-control list-memories \
            --region "$REGION" --output json 2>/dev/null | \
            python3 .github/scripts/find_memory.py || echo "")

          GATEWAY_URL=$(aws bedrock-agentcore-control list-gateways \
            --region us-east-1 --output json 2>/dev/null | \
            python3 .github/scripts/find_gateway_url.py || echo "")

          echo "RUNTIME_ARN=$RUNTIME_ARN"
          echo "MEMORY_ID=$MEMORY_ID"
          echo "GATEWAY_URL=$GATEWAY_URL"

          echo "runtime_arn=$RUNTIME_ARN" >> $GITHUB_OUTPUT
          echo "memory_id=$MEMORY_ID" >> $GITHUB_OUTPUT
          echo "gateway_url=$GATEWAY_URL" >> $GITHUB_OUTPUT

          [ -n "$RUNTIME_ARN" ] && aws ssm put-parameter --name "/dining/RUNTIME_ARN" \
            --value "$RUNTIME_ARN" --type String --overwrite --region "$REGION" \
            && echo "✅ SSM /dining/RUNTIME_ARN"

          [ -n "$MEMORY_ID" ] && aws ssm put-parameter --name "/dining/MEMORY_ID" \
            --value "$MEMORY_ID" --type String --overwrite --region "$REGION" \
            && echo "✅ SSM /dining/MEMORY_ID"

          [ -n "$GATEWAY_URL" ] && aws ssm put-parameter --name "/dining/GATEWAY_URL" \
            --value "$GATEWAY_URL" --type String --overwrite --region "$REGION" \
            && echo "✅ SSM /dining/GATEWAY_URL"

      - name: Update Runtime environment variables
        env:
          REGION: ${{ env.AWS_REGION }}
        run: |
          RUNTIME_ARN=$(aws ssm get-parameter --name "/dining/RUNTIME_ARN" \
            --query "Parameter.Value" --output text --region "$REGION" 2>/dev/null || echo "")
          MEMORY_ID=$(aws ssm get-parameter --name "/dining/MEMORY_ID" \
            --query "Parameter.Value" --output text --region "$REGION" 2>/dev/null || echo "")
          GATEWAY_URL=$(aws ssm get-parameter --name "/dining/GATEWAY_URL" \
            --query "Parameter.Value" --output text --region "$REGION" 2>/dev/null || echo "")

          if [ -z "$RUNTIME_ARN" ] || [ "$RUNTIME_ARN" = "None" ]; then
            echo "⚠️  RUNTIME_ARN 없음 — 환경변수 업데이트 건너뜀"
            exit 0
          fi

          RUNTIME_ID=$(echo "$RUNTIME_ARN" | sed 's|.*/||')
          echo "Runtime ID: $RUNTIME_ID"

          # 현재 환경변수 조회
          CURRENT=$(aws bedrock-agentcore-control get-agent-runtime \
            --agent-runtime-id "$RUNTIME_ID" \
            --region "$REGION" \
            --query "agentRuntime.agentRuntimeArtifact" \
            --output json 2>/dev/null || echo "{}")
          echo "현재 설정: $CURRENT"

          # MEMORY_ID, GATEWAY_WEB_SEARCH_URL 환경변수 업데이트
          aws bedrock-agentcore-control update-agent-runtime \
            --agent-runtime-id "$RUNTIME_ID" \
            --environment-variables "{\"MEMORY_ID\":\"$MEMORY_ID\",\"GATEWAY_WEB_SEARCH_URL\":\"$GATEWAY_URL\"}" \
            --region "$REGION" 2>&1 && echo "✅ Runtime 환경변수 업데이트 완료" || \
          echo "⚠️  Runtime 환경변수 업데이트 실패 (API 미지원일 수 있음 — 계속 진행)"
